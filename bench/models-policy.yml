# Routes the config may serve without being menu candidates. They did not clear
# the funnel and are not claimed to: they are convenience rows, measured and
# kept visible so the exception is on the record rather than in a comment.
utility:
  - id: deepseek/deepseek-v4.1-flash-eco
    provider: opengateway
    reason: "121 tok/s, cache and tools work, 9.4x cheaper per turn on the promo; fails prefill (49.2 ms/1k) and warm latency (2.5 s). Promo-dependent."
