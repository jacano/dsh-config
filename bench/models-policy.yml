# Model policy — what may enter dsh/cordis.patch.yml.
#
# Every number lives in models.csv (measured) or data/plans.json (priced). This
# file only says which ids are in, so it cannot go stale on a provider's Tuesday.

version: 1
updated: 2026-11-16

criteria:
  method: "price and Terminal-Bench, then the agentic fold"
  phases:
    static:
      tbench_min: 38.0
    measured:
      # Floors for "broken", not targets for "good"; about three deviations of
      # their own jitter under the worst admitted row. A gate on the envelope
      # turns measurement noise into a verdict, and a verdict that flips on a
      # rerun is not one.
      speed_min: 85
      latency_max: 3.00
      cache_min: 0.80
    fitness:
      prefill_ms_per_1k_max: 150
      cache_hit_min: 0.80
      retention_4x_min: 0.55
      errors_per_10_max: 1
      tools_valid_min: 0.90

# An id is the route, as the config names it: the block it sits in is its provider.
# If two blocks ever serve the same id, measure says so instead of guessing.
admitted:
  - id: deepseek-v4.1-flash
    note: cheapest route on a cold cache, completions
  - id: claude-haiku-5.5
    note: fastest writer measured, Anthropic route
