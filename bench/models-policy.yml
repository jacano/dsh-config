# Model policy — what may enter dsh/cordis.patch.yml
#
# Written 2026-11-10. The model menu is a curated list, not a catalog window:
# a row is admitted only while it clears every gate below, measured on this
# machine rather than taken from a vendor page. `bench/evaluate.py`
# enforces the list; run it before every commit.
#
# Why these gates: a cheap sticker price means nothing if the route reads the
# prefix slowly or does not cache it, because an agent turn re-reads its context
# every time. That is what removed the Muse rows on 2026-11-10.

version: 1
updated: 2026-11-11

criteria:
  # Thresholds are the envelope of the admitted set: no row may be worse than
  # the current worst on any axis. That closes the menu without exceptions and
  # without recomputing quantiles on every measurement round.
  #
  # Set 2026-11-10 from models.csv. `bench/evaluate.py`
  # proves both directions: every admitted row clears its tier, and every
  # measured row outside the menu misses at least one gate.
  method: "envelope of the admitted set; no waivers, no exceptions"

  # One mechanism for every row, in two phases.
  #
  # Phase 1 is static: capability, price and plan access come from the catalog,
  # so a row that fails here is never measured and never costs a token.
  # Phase 2 is measured: speed, latency and cache are the only properties that
  # need the API, so only the survivors of phase 1 are worth a request.
  #
  # Both phases are the envelope of the admitted rows: nothing new enters
  # without a threshold moving on purpose.
  phases:
    static:
      capability_min: 38.0
      cost_max: 0.0026
    measured:
      speed_min: 95
      latency_max: 2.20
      cache_min: 0.80
      # A short warm prompt flatters every route, and the ranking flips once the
      # prefix is long: what a person feels on a phone is the first token after
      # 60k of context, and the whole turn when the answer is 1,500 tokens.
      latency_60k_max: 2.70
      turn_60k_max: 15.5

  # Third phase: does the route serve the model well enough for a loop?
  # Measured by `bench/evaluate.py` and recorded in models.csv
  # and enforced by bench/evaluate.py. One run per model for now; re-run it
  # when a provider changes something.
    fitness:
      prefill_ms_per_1k_max: 20
      cache_hit_min: 0.80
      retention_4x_min: 0.75
      errors_per_10_max: 1
      tools_valid_min: 0.90

  protocol:
    speed: "median of three 1,600-token generations"
    latency: "median of three warm passes, after two priming requests"
    cache: "works if any warm pass reads cached tokens; a 3-pass hit rate is noise, not signal"

  notes:
    cache: "hit rate over >= 4 warm requests; a two-pass probe reports 0 on rows that do cache"
    access: "no 403 MODEL_NOT_IN_PLAN"

# Decisions only. Every number lives in models.csv (measured) or
# catalog-2026-11-10.csv (priced), so this file cannot go stale: it says which
# ids are in and why, never how fast they were last Tuesday.
admitted:
  - id: deepseek/deepseek-v4.1-flash-fast
    note: default; cheapest on a cold cache, only row on the completions route
  - id: claude-haiku-5-5
    note: fastest writer measured; keeps the Anthropic route alive

# Measured and rejected. The numbers here are as of the drop date and stay put
# on purpose: they are the reason, not the current state. Live numbers for any
# of these models are in models.csv when they were measured.
