# Model policy — what may enter dsh/cordis.patch.yml
#
# The menu is a curated list, not a catalog window: a row is admitted only while
# it clears every gate below. `bench/evaluate.py` enforces the list; run it before
# every commit.
#
# Two folds. The first costs nothing and lives in `bench/shortlist.py`: it prices
# every model a provider sells, applies that plan's discount or credit
# multiplier, and keeps the rows that are cheap enough, reason, and call tools.
# The second is `bench/evaluate.py`: it measures the survivors, and that is the
# only part that spends tokens.
#
# Nothing here trusts the shop. Capability comes from Artificial Analysis
# (`capability.json`), identity and tool support from models.dev
# (`models.dev.json`), and prices from each provider's own published catalogue.
# A provider grading its own product is not evidence.

version: 1
updated: 2026-11-11

criteria:
  # Thresholds are the envelope of the admitted set: no row may be worse than the
  # current worst on any axis, so nothing enters without a threshold moving on
  # purpose, in a commit that names the number.
  #
  # The capability floor was re-based on 2026-11-11 when the source changed: AA
  # scores DeepSeek V4.1 Flash at 30.1 where the catalog claimed 39.5, and the old
  # 38 was measuring an index that no longer exists.
  method: "price, reasoning and tools, then the agentic fold; synthetic metrics inform, they do not veto"

  phases:
    static:
      # Two sources, two questions, no overlap.
      #
      # Artificial Analysis answers "how good is it": one index, one scale, and a
      # row it has not scored is not assumed good. The floor sits just under the
      # row the menu runs on, which is what an envelope means.
      #
      # models.dev answers "what is it": whether it reasons, whether it calls
      # tools, its context and window, its canonical id across providers, and
      # what a token costs. It carries no score and is not asked for one.
      #
      # The provider is asked for neither: a shop grades its own product.
      capability_min: 30.0
      # Money, not usage. A plan that sells $100 of usage for $10 makes a dollar
      # cost ten cents; OpenDesign sells $220 for $10, so 4.5. Gating on usage
      # flatters prepaid routes and punishes the generous plans, which is the
      # opposite of what the wallet says.
      cost_max: 0.0006
      require_reasoning: true
      require_tool_call: true

    measured:
      # These are floors for "broken", not targets for "good". A real agent run
      # with DSH showed why the tighter numbers were wrong: on ten runs across
      # three task sizes, two routes that miss them by 2-3x solved every task in
      # the same time as the ones that pass, because an agent greps and reads
      # fragments — it rarely puts 60k into one call. The time goes on reasoning.
      #
      # So the 60k gates are gone from here. They are still printed by
      # evaluate.py, as information, and fold 3 decides.
      speed_min: 95
      latency_max: 2.60
      cache_min: 0.80

  # Third phase: does the route serve the model well enough for a loop?
  # Measured by `bench/evaluate.py` and recorded in models.csv
  # and enforced by bench/evaluate.py. One run per model for now; re-run it
  # when a provider changes something.
    fitness:
      # 100 ms/1k is "this model cannot be used", not "this model is not optimal".
      # The old 20 rejected routes that work; the agentic fold is the judge now.
      prefill_ms_per_1k_max: 100
      cache_hit_min: 0.80
      retention_4x_min: 0.75
      errors_per_10_max: 1
      tools_valid_min: 0.90

  protocol:
    speed: "median of three 1,600-token generations"
    latency: "median of three warm passes, after two priming requests"
    cache: "works if any warm pass reads cached tokens; a 3-pass hit rate is noise, not signal"

  notes:
    cache: "hit rate over >= 4 warm requests; a two-pass probe reports 0 on rows that do cache"
    access: "no 403 MODEL_NOT_IN_PLAN"

# Decisions only. Every number lives in models.csv (measured) or
# catalog-2026-11-10.csv (priced), so this file cannot go stale: it says which
# ids are in and why, never how fast they were last Tuesday.
admitted:
  - id: deepseek/deepseek-v4.1-flash-fast
    note: default; cheapest on a cold cache, only row on the completions route
  - id: claude-haiku-5-5
    note: fastest writer measured; keeps the Anthropic route alive
  - id: deepseek-v4.1-flash
    note: OpenDesign; cleared the gates after they were relaxed, and solved the agentic fold 3/3
  - id: deepseek/deepseek-v4.1-flash-eco
    note: OpenGateway; 121 tok/s, 3/3 agentic, fastest of the four. Priced from a real invoice, not the advertised -90%: that bill came to 1.94x the promo, so the effective discount is about -80%

