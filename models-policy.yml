# Model policy — what may enter dsh/cordis.patch.yml
#
# Written 2026-11-10. The model menu is a curated list, not a catalog window:
# a row is admitted only while it clears every gate below, measured on this
# machine rather than taken from a vendor page. `scripts/check_models.py`
# enforces the list; run it before every commit.
#
# Why these gates: a cheap sticker price means nothing if the prefix does not
# cache, because an agent turn re-reads its context every time. That is the trap
# both Muse Spark Contributor and GLM-5.3 Flash fell into.

version: 1
updated: 2026-11-10

criteria:
  # No hand-picked thresholds. Every gate is a quantile of a frozen population,
  # and every aggregate is a median or a quantile, never a mean: n is small and
  # one 382 tok/s row moves an average without moving a median.
  #
  # Recompute with: python scripts/percentile_gates.py

  method:
    populations:
      speed: "measurements-2026-11-10.csv, locally measured rows (n=12)"
      latency: "measurements-2026-11-10.csv, locally measured rows (n=10)"
      cost: "catalog-2026-11-10.csv, best-case cost per turn (n=97)"
      capability: "catalog-2026-11-10.csv, scored models (n=74)"
    aggregation: "median and quantiles, with 95% bootstrap CI over 2,000 resamples"
    rule: "a model must clear every gate; cost alone never admits a row"

  gates:
    speed:
      rule: ">= P25 of measured speeds"
      value: 98.75
      ci95: [71.5, 118.0]
      protects: "what you watch while the answer streams"
    latency:
      rule: "<= P50 of measured latencies"
      value: 1.875
      ci95: [1.575, 3.450]
      protects: "how long a turn takes to start"
    cost:
      rule: "<= P25 of the catalog's best-case cost per turn"
      value: 0.0048
      ci95: [0.0020, 0.0080]
      protects: "the budget; invisible in the product"
    capability:
      rule: ">= P50 of the catalog's scored models"
      value: 38.15
      ci95: [33.7, 39.6]
      protects: "not shipping a row that is worse than typical"
    cache:
      rule: "hit rate >= 0.80 over >= 8 warm requests"
      value: 0.80
      protects: "cost and tail latency at once; a miss re-bills the prefix"
    access:
      rule: "no 403 MODEL_NOT_IN_PLAN"
      protects: "an unreachable row is a broken menu entry"

  # With n < 30 on speed and latency these quantiles are provisional: the P25
  # speed gate could sit anywhere in [71.5, 118]. So a row inside a gate's CI is
  # borderline, not rejected — GPT-6 Luna misses three gates by a hair and is the
  # only true borderline in the 2026-11-10 round.
  caveat: "n<30 for speed and latency; treat the quantiles as bands, not lines"

  # The cache needed four passes to show up on the Muse rows, so a probe that
  # stops at two reports 0 on models that do cache. Measure with >= 4.
  cache_probe: ">= 4 identical requests before trusting a zero"

  # Measured 2026-11-10. The open trade, if the owner ever wants it: the latency
  # gate's own CI reaches 3.45 s, and at that value Muse Spark 1.2 Contributor
  # enters at $0.00058/turn, 4.2x cheaper than Fast, still caching at 113 tok/s.
  open_trade: "latency at the CI upper bound (3.45 s) would admit meta/muse-spark-1.2-contributor"

# Rows the config is allowed to serve. Keep in sync with the patch file:
# the checker fails if either side drifts.
admitted:
  - id: deepseek/deepseek-v4.1-flash-fast
    route: command-code
    output_tps: 100-116
    ttft_seconds: 1.7-1.9
    caches: true
    cost_per_turn_usd: 0.0025
    note: default; cheapest on a cold cache, only row on the completions route
  - id: claude-haiku-5-5
    route: command-code-anthropic
    output_tps: 146
    ttft_seconds: 1.7-1.9
    caches: true
    cost_per_turn_usd: 0.0017
    note: fastest and cheapest per turn; wins every gate but is not the default
  - id: minimax/minimax-m3.1-flash
    route: command-code
    output_tps: 118
    ttft_seconds: 1.3-2.2
    caches: true
    cost_per_turn_usd: 0.0024
    note: admitted 2026-11-10 by owner choice; Haiku beats it on every axis, and a spare row costs nothing

# Measured and rejected. Every entry carries the number that killed it, so a
# later round can re-test instead of guessing.
excluded:
  - id: z-ai/glm-5.3-flash
    reason: "74 tok/s, below the 100 gate; $0.0036/turn (1.4x). It does cache (36,992 of 37,014 on pass 2), which the 2026-11-09 round had wrong"
  - id: meta/muse-spark-1.3-contributor
    reason: "caches once warm (8/8 identical requests read 35,939 back), so $0.00058/turn — the cheapest row measured — but TTFT medians 4.5 s (2.6-5.3 s) and misses the 2.5 s gate"
  - id: meta/muse-spark-1.2-contributor
    reason: "113 tok/s and it caches (35,939 of 36,012), $0.00058/turn — the cheapest row measured — but TTFT 3.3-3.6 s misses the 2.5 s gate"
  - id: meta/muse-spark-1.3
    reason: "$1.25/$4.25 without a cache: $0.119/turn"
  - id: meta/muse-spark-open
    reason: "$1.25/$4.25, 38.9 intelligence: dominated by Step 5 on every axis"
  - id: meta/muse-ember
    reason: "299 tok/s, the fastest generation measured, and it caches once warm (7/8) for $0.0012/turn; TTFT 3.6-6.5 s is what keeps it out"
  - id: meta/muse-wonder-1.0
    reason: "403 MODEL_NOT_IN_PLAN"
  - id: claude-sonnet-5-5
    reason: "100 tok/s, exactly on the gate, and $0.0259/turn (10x): the price is what disqualifies it"
  - id: claude-opus-5-5
    reason: "403 MODEL_NOT_IN_PLAN"
  - id: claude-fable-5-2
    reason: "403 MODEL_NOT_IN_PLAN"
  - id: gpt-6.1-sol
    reason: "403 MODEL_NOT_IN_PLAN"
  - id: google/gemini-4-argon
    reason: "403 MODEL_NOT_IN_PLAN"
  - id: stepfun/Step-5-Preview
    reason: "167 tok/s and it caches, but $0.0095/turn (3.8x) and 2.8 s cold TTFT"
  - id: nvidia/nemotron-3.5-super-vl
    reason: "382 tok/s and it caches, but $0.0045/turn (1.8x) and 26.5 intelligence"
  - id: gpt-6-luna
    reason: "95 tok/s, just under the gate; it caches and costs $0.0017/turn, so speed is the only thing keeping it out"
  - id: Qwen/Qwen3.7-Flash
    reason: "64 tok/s; the cheapest sticker in the catalog ($0.03/$0.13) does not survive the speed gate"
  - id: moonshotai/Kimi-K3.1-Pro
    reason: "32 tok/s measured"
  - id: xai/grok-4.7
    reason: "68 tok/s, $0.0555/turn"
  - id: Qwen/Qwen3.8-Max-0902
