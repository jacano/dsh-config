# Model policy — what may enter dsh/cordis.patch.yml
#
# Written 2026-11-10. The model menu is a curated list, not a catalog window:
# a row is admitted only while it clears every gate below, measured on this
# machine rather than taken from a vendor page. `scripts/check_models.py`
# enforces the list; run it before every commit.
#
# Why these gates: a cheap sticker price means nothing if the prefix does not
# cache, because an agent turn re-reads its context every time. That is the trap
# both Muse Spark Contributor and GLM-5.3 Flash fell into.

version: 1
updated: 2026-11-10

criteria:
  # Every gate below is measured on this machine, never read off a vendor page.
  # A row must clear all five. Order matters: cost never admits a row on its own,
  # and cache is the one gate that cannot be traded away.

  speed:
    # End-to-end output rate on a 1,600-token generation.
    min_output_tokens_per_second: 100
    protects: "what you watch while the answer streams. 95 vs 100 is inside measurement noise; 60 is not."

  latency:
    # Time to the first visible token on a 20-60k prefix.
    max_ttft_seconds: 2.5
    protects: "how long a turn takes to start. The softest gate: agentic work is delegated, so a second more start is amortized over a long run."
    caveat: "reasoning models spend this window thinking, so the number moves with effort and is the noisiest of the five."

  cache:
    # A second identical request must read cached tokens back.
    require_prefix_cache: true
    protects: "cost and tail latency at once. A cache miss re-bills the whole prefix and re-processes it, so it fails the price gate too."
    caveat: "not a stable property, and slow to warm: GLM-5.3 Flash read 0 cached on 2026-11-09 and 36,992 on 2026-11-10, and the Muse rows read 0 on pass 2 then 35,9xx from pass 3-4 on. A two-pass probe undercounts; use four or more."

  cost:
    # Agent turn = 90k prompt (89k cached where caching works) + 1.5k output.
    max_cost_per_turn_usd: 0.0025
    protects: "nothing the user feels; it is the owner's budget ceiling, pinned to DeepSeek V4.1 Flash Fast."
    note: "the only gate whose relaxation is invisible in the product — and the one the owner set hardest."

  access:
    # A row that answers 403 MODEL_NOT_IN_PLAN is unusable and cannot be admitted.
    require_plan_access: true
    protects: "nothing: an unreachable row is a broken menu entry."

  # Measured 2026-11-10. The open trade, if the owner ever wants it: relax
  # latency to ~3.5 s and Muse Spark 1.2 Contributor enters at $0.00058/turn,
  # 4.2x cheaper than Fast, still caching at 113 tok/s. It is the only pending
  # row whose whole case is a single gate.
  open_trade: "latency 2.5 s -> 3.5 s would admit meta/muse-spark-1.2-contributor"

# Rows the config is allowed to serve. Keep in sync with the patch file:
# the checker fails if either side drifts.
admitted:
  - id: deepseek/deepseek-v4.1-flash-fast
    route: command-code
    output_tps: 100-116
    ttft_seconds: 1.7-1.9
    caches: true
    cost_per_turn_usd: 0.0025
    note: default; cheapest on a cold cache, only row on the completions route
  - id: claude-haiku-5-5
    route: command-code-anthropic
    output_tps: 146
    ttft_seconds: 1.7-1.9
    caches: true
    cost_per_turn_usd: 0.0017
    note: fastest and cheapest per turn; wins every gate but is not the default

# Measured and rejected. Every entry carries the number that killed it, so a
# later round can re-test instead of guessing.
excluded:
  - id: z-ai/glm-5.3-flash
    reason: "74 tok/s, below the 100 gate; $0.0036/turn (1.4x). It does cache (36,992 of 37,014 on pass 2), which the 2026-11-09 round had wrong"
  - id: meta/muse-spark-1.3-contributor
    reason: "caches once warm (8/8 identical requests read 35,939 back), so $0.00058/turn — the cheapest row measured — but TTFT medians 4.5 s (2.6-5.3 s) and misses the 2.5 s gate"
  - id: meta/muse-spark-1.2-contributor
    reason: "113 tok/s and it caches (35,939 of 36,012), $0.00058/turn — the cheapest row measured — but TTFT 3.3-3.6 s misses the 2.5 s gate"
  - id: meta/muse-spark-1.3
    reason: "$1.25/$4.25 without a cache: $0.119/turn"
  - id: meta/muse-spark-open
    reason: "$1.25/$4.25, 38.9 intelligence: dominated by Step 5 on every axis"
  - id: meta/muse-ember
    reason: "299 tok/s, the fastest generation measured, and it caches once warm (7/8) for $0.0012/turn; TTFT 3.6-6.5 s is what keeps it out"
  - id: meta/muse-wonder-1.0
    reason: "403 MODEL_NOT_IN_PLAN"
  - id: claude-sonnet-5-5
    reason: "100 tok/s, exactly on the gate, and $0.0259/turn (10x): the price is what disqualifies it"
  - id: claude-opus-5-5
    reason: "403 MODEL_NOT_IN_PLAN"
  - id: claude-fable-5-2
    reason: "403 MODEL_NOT_IN_PLAN"
  - id: gpt-6.1-sol
    reason: "403 MODEL_NOT_IN_PLAN"
  - id: google/gemini-4-argon
    reason: "403 MODEL_NOT_IN_PLAN"
  - id: stepfun/Step-5-Preview
    reason: "167 tok/s and it caches, but $0.0095/turn (3.8x) and 2.8 s cold TTFT"
  - id: nvidia/nemotron-3.5-super-vl
    reason: "382 tok/s and it caches, but $0.0045/turn (1.8x) and 26.5 intelligence"
  - id: gpt-6-luna
    reason: "95 tok/s, just under the gate; it caches and costs $0.0017/turn, so speed is the only thing keeping it out"
  - id: Qwen/Qwen3.7-Flash
    reason: "64 tok/s; the cheapest sticker in the catalog ($0.03/$0.13) does not survive the speed gate"
  - id: moonshotai/Kimi-K3.1-Pro
    reason: "32 tok/s measured"
  - id: xai/grok-4.7
    reason: "68 tok/s, $0.0555/turn"
  - id: Qwen/Qwen3.8-Max-0902
    reason: "47 tok/s, $0.0333/turn"
  - id: zai-org/GLM-5.3
    reason: "67 tok/s, $0.0311/turn"
  - id: z-ai/glm-5.3-flashx
    reason: "slower than Fast for $0.0089/turn, no published score"
  - id: deepseek/deepseek-v4.1-flash
    reason: "9-47 s TTFT on this lane"
  - id: deepseek/deepseek-v4.1-flash-ultrafast
    reason: "$2.40/$9.60, $0.0211/turn for latency Fast already provides"

# Clears every gate but earns nothing: kept out to avoid a third route and a
# row that only duplicates a better one. Re-admit by moving it to `admitted`
# if Haiku 5.5 ever becomes unavailable.
redundant:
  - id: minimax/minimax-m3.1-flash
    reason: "passes every gate (118 tok/s, 35,072 cached, $0.0024/turn) but Haiku 5.5 beats it on speed, intelligence and price"
