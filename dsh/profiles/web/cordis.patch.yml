# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# Note: the web app disables this host "tool-web" row and composes the
# model-facing web tools per agent preset, so this override covers only the
# host plane. For web sessions the effective switch is the "standard-nosearch"
# preset (see the README). Kept here for the host plane.
- id: tool-web
  config:
    search: false
    fetch: true
