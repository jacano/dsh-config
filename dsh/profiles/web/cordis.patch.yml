# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# Disable web search.
#
# The web app disables the host "tool-web" row and composes the model-facing
# web tools per agent preset, so a "tool-web" override here would not reach web
# sessions. Disabling the search provider removes the capability on every plane
# instead. web_search stays in the tool list but returns a structured error when
# called, and no search request leaves the machine.
- id: web-search-deepseek
  disabled: true
