- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-08-13.1
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: command-code
    model: deepseek/deepseek-v4.1-flash-fast

# DeepSeek official, off. These rows carry no `name` on purpose: `llm-deepseek`
# mounts `@deepseek-ai/dsh-llm-deepseek-api-key` in the desktop bundle and
# `@deepseek-ai/dsh-llm-deepseek` in the npm install, and a patch whose `name`
# does not match its row is skipped with a warning, not applied.
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: deepseek-llm-api-extensions
  disabled: true
# `deepseek-account`, `account-controller` and `ui-settings-account` stay on: they
# are the account page, not the provider. `tool-web` cannot reach the copy an
# agent preset composes, so the search-provider disable above is the real switch.
- id: tool-web
  config:
    search: false
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      command-code:
        displayName: Command Code (openai-completions)
        api: openai-completions
        baseURL: https://api.commandcode.ai/provider/v1
        apiKeyEnv: COMMANDCODE_API_KEY
        defaultContextWindow: 1000000
        # A fallback, not an override: an entry's own `input` wins, so a
        # text-only model added here must declare `input: [text]`.
        defaultInput: [text, image]
        # Every model thinks by default; `minimal` and `none` are refused with
        # HTTP 400, and both rows here take the same five levels, hence the
        # single alias. GLM rejects `off` with 400, so no row declares it.
        models:
          # Two rows survive the 2026-11-09 measurement round; MODELS.md has
          # the numbers behind each call. Labels are the `name` the provider's
          # own catalog returns for each id, copied verbatim.
          #
          # Fast: the 1017 snapshot on the stable lane. Cheapest per agent turn
          # of everything measured ($0.0025) because it caches a 90k prompt at
          # ~99%, and quick (1.2 s to first token, ~150 tok/s).
          - id: deepseek/deepseek-v4.1-flash-fast
            name: DeepSeek V4.1 Flash Fast (latest)
            contextWindow: 1000000
            maxTokens: 32768
            reasoningEfforts: &efforts
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          # Kept as the one non-DeepSeek row: it is the only third-party model
          # here with a published intelligence score (41.8 / coding 71.5) and a
          # working zero-data-retention upstream. It is much the slower row and
          # it does not cache prompts, so it is a second opinion, not a daily
          # driver. It rejects `off` with 400, hence the shared alias.
          - id: z-ai/glm-5.3-flash
            name: GLM-5.3 Flash
            contextWindow: 1048576
            maxTokens: 131072
            reasoningEfforts: *efforts
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    step: done
