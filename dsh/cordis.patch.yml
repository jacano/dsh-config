- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      danger-full-access: { sandbox: danger-full-access, approval: never }
    defaultPreset: danger-full-access
- { id: agent-default-model, name: "@deepseek-ai/dsh-agent-default-model", config: { provider: opendesign, model: deepseek-v4.1-flash } }
- { id: llm-deepseek, disabled: true }
- { id: llm-deepseek-account, disabled: true }
- { id: web-search-deepseek, disabled: true }
- { id: deepseek-llm-api-extensions, disabled: true }
- { id: tool-web, config: { search: false } }
- { id: ui-settings-account, name: "@deepseek-ai/dsh-client-ui-settings-account", config: { step: done } }
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      opendesign:
        displayName: OpenDesign (Responses)
        api: openai-responses
        baseURL: https://amr-link.open-design.ai/v1
        apiKeyEnv: OPENDESIGN_API_KEY
        defaultContextWindow: 1000000
        defaultInput: [text, image]
        models:
          - { id: deepseek-v4.1-flash, name: DeepSeek V4.1 Flash (OpenDesign), contextWindow: 1000000, maxTokens: 32768, reasoningEfforts: &efforts { low: low, medium: medium, high: high, xhigh: xhigh, max: max } }
      opendesign-anthropic:
        displayName: OpenDesign (Messages)
        api: anthropic-messages
        baseURL: https://amr-link.open-design.ai
        apiKeyEnv: OPENDESIGN_API_KEY
        defaultContextWindow: 1000000
        defaultMaxTokens: 32768
        models:
          - { id: claude-haiku-5.5, name: Claude Haiku 5.5 (OpenDesign), contextWindow: 1000000, maxTokens: 32768, reasoningEfforts: *efforts }
