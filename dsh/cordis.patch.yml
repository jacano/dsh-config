# The one configuration of this machine: every profile reads it — the desktop app,
# `dsh web` (which is `--profile web`) and the headless one — and it outranks a
# profile's own patch layer.
#
# `id` names the entry, `name` the plugin behind it, and the value under `config`
# is that entry's config. A block commented out is a provider that is out of the
# model menu and one "# " away from coming back.
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-08-13.1
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: command-code
    model: deepseek/deepseek-v4.1-flash
    reasoningEffort: high

# ── DeepSeek oficial, apagado entero ──────────────────────────────────────────
#
# No queda registrado nada del proveedor oficial: ni la ruta de chat por API
# key, ni la de cuenta, ni la de búsqueda, ni el plano de campos que solo viajaba
# en peticiones oficiales. Sin ruta registrada no hay modelo en el menú, no hay
# tarjeta en Ajustes → Modelos y ni una sesión vieja que guardó deepseek-flash
# puede volver a cobrarse.
#
# Estas entradas van SIN `name` a propósito. El id `llm-deepseek` ya no apunta al
# mismo plugin en todas las capas: el bundle del escritorio monta ahí
# `@deepseek-ai/dsh-llm-deepseek-api-key` — el que declara el proveedor
# "DeepSeek" que salía en Ajustes → Modelos con el punto verde "API key
# configured" — mientras la instalación npm monta `@deepseek-ai/dsh-llm-deepseek`.
# Un parche cuyo `name` no casa con el del bundle se salta EN SILENCIO
# (`patch: name mismatch ... skipping`, solo un warning del loader), que es
# exactamente lo que pasaba antes: el apagado nunca llegó a aplicarse. Sin `name`
# el parche casa por id, que es el identificador estable.
#
# Para recuperar la ruta oficial de fábrica, borra este bloque.
- id: llm-deepseek # ruta oficial por API key (proveedor "DeepSeek")
  disabled: true
- id: llm-deepseek-account # ruta oficial por cuenta (proveedor "DeepSeek Account")
  disabled: true
- id: web-search-deepseek # proveedor de búsqueda de la ruta oficial
  disabled: true
# Plano de campos que solo se adjuntaban a peticiones oficiales. Apagado el
# registro, `session-log-deepseek` y `plugin-package-inventory-deepseek` dejan de
# aplicar por su cuenta (lo inyectan), así que ni el log de sesión ni el
# inventario de plugins viajan ya en una petición oficial.
- id: deepseek-llm-api-extensions
  disabled: true
- id: session-log-deepseek
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
#
# Lo que queda vivo a propósito, y no es el proveedor: `deepseek-account`
# (servicio de la cuenta de plataforma), `account-controller` (su remote) y
# `ui-settings-account` (página Ajustes → Cuenta y avatar de la barra). Esa
# última es la dueña de los config-form `developerTools` y `usage`, y
# `developerTools` es la puerta del selector de presets y de la pestaña
# Trajectory: apagarla rompe UI que sí se usa. Si quieres fuera también la
# página de Cuenta, añade `deepseek-account` y `account-controller` con
# `disabled: true` y asume la sección degradada.
#
# El host `tool-web` (activo en headless; el bundle del escritorio ya lo
# desactiva): además del proveedor, fuera la búsqueda del propio tool. `config`
# se reemplaza entero, no se fusiona, por eso van también los dos campos de
# fábrica; y no alcanza al `tool-web` que compone un preset de agente, porque un
# preset no tiene semántica de parches — de ahí que el interruptor de verdad sea
# el proveedor de arriba.
- id: tool-web
  config:
    search: false
    fetch: true
    searchTimeoutMs: 60000
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      # OpenCode, commented out: out of the menu, one "# " from coming back.
      # opencode-go:
      #   displayName: OpenCode Go (openai-completions)
      #   api: openai-completions
      #   baseURL: https://opencode.ai/zen/go/v1
      #   apiKeyEnv: OPENCODE_API_KEY
      #   headers:
      #     x-opencode-session: ses_dsh_8f2a1c4e7b6d4a90
      #   defaultContextWindow: 1048576
      #   defaultMaxTokens: 32768
      #   models:
      #     - id: deepseek-v4.1-flash
      #       name: DeepSeek V4.1 Flash (OpenCode Go, openai-completions)
      #       contextWindow: 1048576
      #       maxTokens: 32768
      #     - id: glm-5.3-flash
      #       name: GLM-5.3 Flash (OpenCode Go, openai-completions)
      #       contextWindow: 1000000
      #       maxTokens: 131072
      #     - id: space-bunny-free
      #       name: Space Bunny Free (OpenCode Go, openai-completions)
      #       contextWindow: 1048576
      #       maxTokens: 524288
      # opencode-go-responses:
      #   displayName: OpenCode Go (openai-responses)
      #   api: openai-responses
      #   baseURL: https://opencode.ai/zen/go/v1
      #   apiKeyEnv: OPENCODE_API_KEY
      #   headers:
      #     x-opencode-session: ses_dsh_8f2a1c4e7b6d4a90
      #   defaultContextWindow: 1048576
      #   defaultMaxTokens: 131072
      #   models:
      #     - id: muse-spark-1.3-contributor
      #       name: Muse Spark 1.3 Contributor (OpenCode Go, openai-responses)
      #       contextWindow: 1048576
      #       maxTokens: 131072
      command-code:
        displayName: Command Code (openai-completions)
        api: openai-completions
        baseURL: https://api.commandcode.ai/provider/v1
        apiKeyEnv: COMMANDCODE_API_KEY
        defaultContextWindow: 1000000
        defaultMaxTokens: 32768
        # Vision on the whole route. Without this the resolved input is [text] and
        # pi-ai's transformMessages() silently swaps every image for the literal
        # text "(image omitted: model does not support images)" — the dsh-agent
        # seam refuses even earlier, at read_image/admission, naming the model.
        # The eight models below all read images, so declaring it once here beats
        # repeating `input: [text, image]` on entries that already say it: an
        # entry's own `input` WINS over this fallback, so a future text-only model
        # added to the list must declare `input: [text]` to opt back out.
        defaultInput: [text, image]
        # Per-model reasoning on this route, probed against api.commandcode.ai: all
        # eight models take `reasoning_effort` at the same five levels (low, medium,
        # high, xhigh, max) and answer HTTP 400 to `minimal` and `none`.
        #
        # Every one of them thinks by default — with no parameter they return
        # reasoning text — and none can be turned off: `thinking: {type: disabled}`,
        # `thinking: false` and `enable_thinking: false` all come back 200 and are
        # then ignored. So no entry declares `off:` below. Offering an "Off" that
        # does not turn thinking off would be worse than offering none: pi-ai pins
        # every undeclared level to null, which keeps Off and Minimal out of the
        # picker's Effort submenu and leaves the five real levels visible.
        models:
          - id: deepseek/deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash (Command Code, openai-completions)
            contextWindow: 1000000
            maxTokens: 32768
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: deepseek/deepseek-v4.1-flash-fast
            name: DeepSeek V4.1 Flash Fast (Command Code, openai-completions)
            contextWindow: 1000000
            maxTokens: 32768
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: z-ai/glm-5.3-flash
            name: GLM-5.3 Flash (Command Code, openai-completions)
            contextWindow: 1048576
            maxTokens: 131072
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: z-ai/glm-5.3-flashx
            name: GLM-5.3 FlashX (Command Code, openai-completions)
            contextWindow: 1000000
            maxTokens: 131072
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: meta/muse-spark-1.3-contributor
            name: Muse Spark 1.3 Contributor (Command Code, openai-completions)
            contextWindow: 1048576
            maxTokens: 131072
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: stealth/space-bunny-alpha
            name: Space Bunny Alpha (Command Code, openai-completions)
            contextWindow: 1000000
            maxTokens: 131072
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          # Probed the same way as the rest. Both read images, so the route
          # fallback above covers them and neither declares `input`. MiMo refuses
          # max_tokens 262144, so it takes the house 131072; Step accepts 262144
          # and is declared at 131072 too, the value the other 1M-context routes
          # here carry.
          - id: xiaomi/mimo-v2.6-flash
            name: MiMo V2.6 Flash (Command Code, openai-completions)
            contextWindow: 1048576
            maxTokens: 131072
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: stepfun/Step-5-Preview
            name: Step 5 Preview (Command Code, openai-completions)
            contextWindow: 1000000
            maxTokens: 131072
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: standard
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: ui-settings-account
  # A plugin of the desktop client: the `web` and `headless` profiles have no such
  # entry, log `patch: entry "ui-settings-account" not found` and skip it.
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    usage: detailed
    developerTools: true
    purpose: null
    process: standard
    completion: api-key
