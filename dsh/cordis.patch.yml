- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-08-13.1
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: command-code
    model: deepseek/deepseek-v4.1-flash

# DeepSeek official, off. These rows carry no `name` on purpose: `llm-deepseek`
# mounts `@deepseek-ai/dsh-llm-deepseek-api-key` in the desktop bundle and
# `@deepseek-ai/dsh-llm-deepseek` in the npm install, and a patch whose `name`
# does not match its row is skipped with a warning, not applied.
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: deepseek-llm-api-extensions
  disabled: true
# `deepseek-account`, `account-controller` and `ui-settings-account` stay on: they
# are the account page, not the provider. `tool-web` cannot reach the copy an
# agent preset composes, so the search-provider disable above is the real switch.
- id: tool-web
  config:
    search: false
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      command-code:
        displayName: Command Code (openai-completions)
        api: openai-completions
        baseURL: https://api.commandcode.ai/provider/v1
        apiKeyEnv: COMMANDCODE_API_KEY
        defaultContextWindow: 1000000
        # A fallback, not an override: an entry's own `input` wins, so a
        # text-only model added here must declare `input: [text]`.
        defaultInput: [text, image]
        # Every model thinks by default and no switch turns it off, so none
        # declares `off:`; `minimal` and `none` are refused with HTTP 400, and
        # every model takes the same five levels, hence the alias.
        models:
          # Both V4.1 rows, labelled with the `name` the provider's own catalog
          # returns for each id, "(latest)" suffix and all. Since the 2026-10-19
          # rollout both slugs serve the same 1017 snapshot and both are tagged
          # "(latest)"; no separate "…-1017" id is callable (400). They still
          # differ at the wire: only the Fast lane answers a thinking-off request
          # with 0 reasoning tokens.
          - id: deepseek/deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash (latest)
            contextWindow: 1000000
            maxTokens: 32768
            reasoningEfforts: &efforts
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: deepseek/deepseek-v4.1-flash-fast
            name: DeepSeek V4.1 Flash Fast (latest)
            contextWindow: 1000000
            maxTokens: 32768
            reasoningEfforts: *efforts
          - id: z-ai/glm-5.3-flash
            name: GLM-5.3 Flash
            contextWindow: 1048576
            maxTokens: 131072
            reasoningEfforts: *efforts
          - id: z-ai/glm-5.3-flashx
            name: GLM-5.3 FlashX
            contextWindow: 1000000
            maxTokens: 131072
            reasoningEfforts: *efforts
          - id: meta/muse-spark-1.3-contributor
            name: Muse Spark 1.3 Contributor
            contextWindow: 1048576
            maxTokens: 131072
            reasoningEfforts: *efforts
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    step: done
