- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      danger-full-access: { sandbox: danger-full-access, approval: never }
    defaultPreset: danger-full-access
- { id: agent-default-model, name: "@deepseek-ai/dsh-agent-default-model", config: { provider: command-code, model: deepseek/deepseek-v4.1-flash-fast } }
- { id: llm-deepseek, disabled: true }
- { id: llm-deepseek-account, disabled: true }
- { id: web-search-deepseek, disabled: true }
- { id: deepseek-llm-api-extensions, disabled: true }
- { id: tool-web, config: { search: false } }
- { id: ui-settings-account, name: "@deepseek-ai/dsh-client-ui-settings-account", config: { step: done } }
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      command-code:
        displayName: Command Code
        api: openai-completions
        baseURL: https://api.commandcode.ai/provider/v1
        apiKeyEnv: COMMANDCODE_API_KEY
        defaultContextWindow: 1000000
        defaultInput: [text, image]
        models:
          - { id: deepseek/deepseek-v4.1-flash-fast, name: DeepSeek V4.1 Flash Fast, contextWindow: 1000000, maxTokens: 32768, reasoningEfforts: &efforts { low: low, medium: medium, high: high, xhigh: xhigh, max: max } }
      command-code-anthropic:
        displayName: Command Code (Claude)
        api: anthropic-messages
        baseURL: https://api.commandcode.ai/provider
        apiKeyEnv: COMMANDCODE_API_KEY
        defaultContextWindow: 1000000
        defaultMaxTokens: 32768
        compat: { forceAdaptiveThinking: true }
        models:
          - { id: claude-haiku-5-5, name: Claude Haiku 5.5, contextWindow: 1000000, maxTokens: 32768, reasoningEfforts: *efforts }
      opendesign:
        displayName: OpenDesign
        api: openai-completions
        baseURL: https://amr-link.open-design.ai/v1
        apiKeyEnv: OPENDESIGN_API_KEY
        defaultContextWindow: 1000000
        defaultInput: [text, image]
        models:
          - { id: deepseek-v4.1-flash, name: DeepSeek V4.1 Flash, contextWindow: 1000000, maxTokens: 32768 }
      opengateway:
        displayName: OpenGateway
        api: openai-completions
        baseURL: https://apis.opengateway.ai/v1
        apiKeyEnv: OPENGATEWAY_API_KEY
        defaultContextWindow: 1000000
        defaultInput: [text, image]
        models:
          - { id: deepseek/deepseek-v4.1-flash-eco, name: DeepSeek V4.1 Flash Eco, contextWindow: 1000000, maxTokens: 32768 }
