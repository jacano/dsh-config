name: frontier

on:
  push:
    branches: [main]
    paths:
      - 'bench/data/plans.json'
      - 'bench/data/tbench.json'
      - 'bench/models.csv'
      - 'bench/models-policy.yml'
      - 'bench/bench.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate the page
        run: python bench/bench.py chart --html docs/index.html
      - name: Commit it if it moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "chore: the frontier, regenerated from the data"
          git push
